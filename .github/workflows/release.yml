name: Release

# Al fusionar a main un cambio en version.json se compila la app en Windows y se
# publica un Release (tag vX.Y.Z) con GameBoost_Setup.exe. La app consulta
# version.json en main para auto-actualizarse. Para sacar una version nueva:
# sube el numero en build.ps1, App.cs (3 lineas) y version.json, y fusiona a main.
on:
  push:
    branches: [main]
    paths: ['version.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        shell: powershell
        run: ./build.ps1

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -o '"version": *"[^"]*"' dist/version.json | sed 's/.*: *"//;s/"//')
          notes=$(grep -o '"notes": *"[^"]*"' dist/version.json | sed 's/.*: *"//;s/"//')
          if gh release view "v$v" >/dev/null 2>&1; then echo "El release v$v ya existe"; exit 0; fi
          gh release create "v$v" dist/GameBoost_Setup.exe dist/GameBoost.exe dist/version.json \
            --target "${{ github.sha }}" --title "Blad Boost v$v" --notes "$notes"
